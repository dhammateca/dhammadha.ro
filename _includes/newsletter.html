<section class="section newsletter-section" id="newsletter" aria-labelledby="newsletter-title">
  <div class="site-shell newsletter-shell">
    <div class="newsletter-card">
      <div class="newsletter-card__content">
        <h3 id="newsletter-title">Scrisori de la Dhammadha.ro</h3>
        <p>Un newsletter despre Dhamma, practică și felul în care textele vechi ajung să vorbească în prezent.</p>
      </div>
      <form
        class="newsletter-form"
        action="https://buttondown.com/api/emails/embed-subscribe/dhammadharo"
        method="post">
        <label class="visually-hidden" for="newsletter-email">Adresa de email</label>
        <input
          id="newsletter-email"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="adresa@email.ro"
          required>
        <input name="embed" type="hidden" value="1">
        <button class="button" type="submit">Abonează-te</button>
      </form>
    </div>
  </div>
</section>
